[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliax-sdk"
version = "0.1.0"
description = "The thin Python client for the Reliax platform: one call out, one certificate back. Standard library only."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Reliax" },
]
keywords = [
    "conformal-prediction",
    "uncertainty-quantification",
    "calibration",
    "venn-abers",
    "drift-detection",
    "model-risk",
    "ai-governance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
verify = ["reliax-certificate>=0.1.0"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://reliax.io"
Source = "https://github.com/reliax-io/reliax-python"
Issues = "https://github.com/reliax-io/reliax-python/issues"
Evaluation = "https://github.com/reliax-io/reliax-evaluation"

[tool.hatch.build.targets.wheel]
packages = ["src/reliax"]
